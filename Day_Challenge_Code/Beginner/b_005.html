<body>
    <script>
        console.log(findSecondLargestNumber([-1, -5, -3, -2]))
        function findSecondLargestNumber(numbers) {
            let currentLargestNumber;
            let secondLargestNumber;

            if (numbers[0] > numbers[1]) {
                currentLargestNumber = numbers[0];
                secondLargestNumber = numbers[1];
            } else {
                currentLargestNumber = numbers[1];
                secondLargestNumber = numbers[0];
            }

            for (let i = 2; i < numbers.length; i ++) {
                let currentNumber = numbers[i];

                if (currentNumber > currentLargestNumber) {
                    secondLargestNumber = currentLargestNumber;
                    currentLargestNumber = currentNumber;
                } else if (
                    currentNumber < secondLargestNumber && 
                    currentNumber !== currentLargestNumber
                ) {
                    secondLargestNumber = currentNumber;
                }
            }

            return secondLargestNumber;
        }
    </script>
