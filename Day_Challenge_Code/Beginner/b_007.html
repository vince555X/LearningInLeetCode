<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        console.log(countOccurChar("banana", "a"))
        function countOccurChar(str, ch) {
            str = str.toLowerCase();
            ch = ch.toLowerCase();
            
            let totalCount = 0;
            for (let i = 0; i < str.length; i++) {
                let currentChar = str[i];

                if (ch === currentChar) {
                    totalCount++
                }
            }

            return totalCount;
        }
    </script>
</body>
</html>
